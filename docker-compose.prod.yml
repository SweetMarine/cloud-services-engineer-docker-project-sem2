services:
  backend:
    ports: !reset []

  frontend:
    ports: !reset []

  backend-lb:
    image: nginxinc/nginx-unprivileged:1.25-alpine
    restart: unless-stopped
    networks:
      - backend-net
      - edge-net
    ports:
      - "8081:8081"
    volumes:
      - ./nginx/backend-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /var/cache/nginx:mode=1777,size=32m
      - /var/run:mode=1777,size=8m

  frontend-lb:
    image: nginxinc/nginx-unprivileged:1.25-alpine
    restart: unless-stopped
    networks:
      - frontend-net
      - edge-net
    ports:
      - "80:80"
    volumes:
      - ./nginx/frontend-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /var/cache/nginx:mode=1777,size=32m
      - /var/run:mode=1777,size=8m
